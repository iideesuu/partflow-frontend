server {
  listen 80;
  server_name _;
  # PLM files are uploaded directly from the browser to MinIO. This limit
  # covers import/export control requests and protects the reverse proxy.
  client_max_body_size 5g;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Same-origin API path. The backend remains HTTP inside Docker; TLS is
  # terminated only by the outer deployment Nginx as required by V1.5.
  location /api/ {
    proxy_pass http://web:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Vite/React client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
