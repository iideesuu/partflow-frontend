server {
  listen 80;
  server_name _;
  # Docker Compose may recreate the web container and assign a new IP.
  # Resolve the service name through Docker DNS at request time instead of
  # pinning the address resolved when nginx started.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $plm_backend http://web:8000;
  # PLM files are uploaded directly from the browser to MinIO. This limit
  # covers import/export control requests and protects the reverse proxy.
  client_max_body_size 5g;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Same-origin API path. The backend remains HTTP inside Docker; TLS is
  # terminated only by the outer deployment Nginx as required by V1.5.
  location /api/ {
    proxy_pass $plm_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Vite/React client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
